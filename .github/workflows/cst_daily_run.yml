name: Daily CST Indicator & Valuation Run

on:
  schedule:
    # 15:30 UTC = 10:30 AM EST (1st hour post-open)
    # 22:00 UTC = 5:00 PM EST (Post-market close)
    - cron: '30 15 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: 'true'

jobs:
  run-cst-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute CST Indicator Engine
        run: |
          python cst_engine.py

      - name: Commit and Push Updated Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add CST_Portfolio_Analysis_Results.csv CST_Indicator_Legend_Guide.csv
          git diff-index --quiet HEAD || git commit -m "Auto-update CST Analysis Results [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push
          
- name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: jerryleesg@gmail.com
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: 🚀 CST Portfolio Dashboard Updated
          to: jerryleesg@gmail.com
          from: GitHub Action Bot
          body: |
            Your Covered-Swing-Trade (CST) analysis has successfully executed and sorted your holdings!
            
            🔗 View your live Google Sheet Dashboard here:
            https://docs.google.com/spreadsheets/d/18lXe2mWgNNDMMe3sd-TfGFrHIQTXhow6G4KPqpUVJKI/edit
