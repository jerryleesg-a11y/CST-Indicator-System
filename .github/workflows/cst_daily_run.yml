name: Daily CST Indicator & Valuation Run

on:
  schedule:
    # Runs daily at 22:00 UTC (6:00 AM SGT next day)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-cst-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute CST Indicator Engine
        run: |
          python cst_engine.py

      - name: Commit and Push Updated Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add CST_Portfolio_Analysis_Results.csv CST_Indicator_Legend_Guide.csv
          git diff-index --quiet HEAD || git commit -m "Auto-update CST Analysis Results [$(date -u +'%Y-%m-%d')]"
          git push
